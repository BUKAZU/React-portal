# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Release npm package

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: ['master']
    types: [closed]

jobs:
  build:
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.merged == true &&
        (
          contains(github.event.pull_request.labels.*.name, 'version bump') ||
          contains(github.event.pull_request.labels.*.name, 'version-bump')
        )
      )
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.merged == true &&
        (
          contains(github.event.pull_request.labels.*.name, 'version bump') ||
          contains(github.event.pull_request.labels.*.name, 'version-bump')
        )
      )
    permissions:
      packages: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - name: Get version
        run: |
          echo "VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV
      - name: Build (bakes the Sentry DSN into the website bundle)
        run: npm run build
        env:
          BUKAZU_SENTRY_DSN: ${{ vars.BUKAZU_SENTRY_DSN }}
      - name: Verify the website bundle
        run: npm run verify:website
        env:
          BUKAZU_SENTRY_DSN: ${{ vars.BUKAZU_SENTRY_DSN }}
      - name: Publish to npm
        run: |
          if [[ "$VERSION" == *-* ]]; then
            # Prereleases (e.g. 4.0.0-beta.3) must never take the `latest`
            # dist-tag, or plain `npm install` would hand consumers a beta.
            npm publish --tag "$(echo "${VERSION#*-}" | cut -d. -f1)"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{secrets.npm_token}}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
